<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuimó – Học tiếng Trung theo HSK 2.0 và HSK 3.0</title>
<meta name="description" content="Học tiếng Trung theo giáo trình HSK 2.0 và HSK 3.0: từ vựng có Hán Việt, ngữ pháp, hội thoại, tập viết chữ Hán, thẻ nhớ và luyện tập.">
<meta name="theme-color" content="#F4F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F171D" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="__FAVICON_SVG__">
<link rel="icon" type="image/png" sizes="32x32" href="__FAVICON_PNG__">
<link rel="apple-touch-icon" href="__APPLE_ICON__">
__HEAD_EXTRA__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens: 3 màu chủ đạo (ngọc, son, nắng) + tông trung tính ---------- */
:root{
  --jade:#12B886;--jade-d:#0B8A64;--jade-soft:#E2F6EE;--jade-ink:#07563F;
  --brand:#FD7047;                                   /* cam thương hiệu, chỉ dùng trang trí (tương phản 2,8:1) */
  --verm:#E85A34;--verm-d:#B8401F;--verm-strong:#C43F20;--verm-soft:#FFE9E1;--verm-ink:#8A2A13;
  --sun:#FFC233;--sun-d:#D8980A;--sun-soft:#FFF3D1;--sun-ink:#7A5300;
  --blue-soft:#E6EFFD;
  --ink:#1A1E26;--ink-2:#4B5664;--ink-3:#6F7A88;
  --paper:#F4F8F6;--surface:#FFFFFF;--surface-2:#ECF2EF;--line:#D9E3DF;--line-2:#BFCDC7;
  --t1:#2F72D6;--t2:#0C9A6E;--t3:#C07F00;--t4:#DB4324;--t5:#7F8995;
  --radius:14px;--radius-l:22px;
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-zh-d:'Noto Serif SC','Songti SC','SimSun',serif;
  color-scheme:light;
}
/* Dark mode: theo hệ thống, trừ khi người dùng ép light; hoặc ép dark bằng nút */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ __DARK__ } }
:root[data-theme="dark"]{ __DARK__ }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.zh{font-family:var(--f-zh)}
.zh-d{font-family:var(--f-zh-d)}
:focus-visible{outline:3px solid var(--t1);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Khung ứng dụng ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;padding:24px 16px;border-right:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--ink)}
.mark{width:40px;height:40px;border-radius:12px;background:var(--jade);color:#fff;display:grid;place-items:center;font-family:var(--f-ui);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--jade-d)}
.navlist{flex:none;display:flex;flex-direction:column;gap:6px}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:2px solid transparent;background:none;color:var(--ink-2);font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.navbtn svg{width:22px;height:22px;flex:none}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-ink)}
.side-foot{margin-top:auto;font-size:13px;color:var(--ink-3);line-height:1.5}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 28px;background:var(--paper)}
.brand-m{display:none;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;font-weight:700;font-size:15px;background:var(--surface);border:2px solid var(--line)}
.chip svg{width:18px;height:18px}
.chip .lbl{font-weight:500;color:var(--ink-3);font-size:13px}
.chip.streak svg{color:var(--brand)}
.chip.xp svg{color:var(--t3)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:13px}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:var(--line-2)}
main{max-width:920px;margin:0 auto;padding:12px 28px 64px;outline:none}
main:focus,main:focus-visible{outline:none}
.bnav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .brand-m{display:flex}
  .top{padding:10px 16px;gap:8px}
  main{padding:8px 16px 110px}
  .chip .lbl{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bnav .navbtn{flex:1;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;border-radius:10px;text-align:center}
}
/* Chế độ tập trung khi làm bài: ẩn điều hướng như Duolingo */
body.focus .side,body.focus .top,body.focus .bnav{display:none}
body.focus .shell{grid-template-columns:minmax(0,1fr)}
body.focus main{max-width:720px;padding:0 28px}
@media (max-width:860px){body.focus main{padding:0 16px}}

/* ---------- Nút bấm "nổi khối" ---------- */
.btn{--c:var(--jade);--cd:var(--jade-d);--fg:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:0;border-radius:var(--radius);background:var(--c);color:var(--fg);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--cd);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn-ghost{--c:var(--surface);--cd:var(--line);--fg:var(--jade-ink);border:2px solid var(--line)}
.btn-verm{--c:var(--verm-strong);--cd:#8F2E16}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-block{width:100%}

/* ---------- Trang chủ ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:28px;border-radius:var(--radius-l);background:var(--surface);border:2px solid var(--line)}
.hello{margin:0 0 6px;color:var(--ink-3);font-weight:600}
.hero h1{margin:0 0 22px;font-size:clamp(28px,4.2vw,40px);line-height:1.15;letter-spacing:-.02em;font-weight:800;max-width:15ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-char{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-char figcaption{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);font-size:15px}
.gbox{position:relative;width:200px;height:200px}
.gbox .grid{position:absolute;inset:0;width:100%;height:100%}
.grid rect{fill:var(--surface-2);stroke:var(--verm);stroke-width:1.2}
.grid line{stroke:var(--verm);stroke-opacity:.4;stroke-width:.5;stroke-dasharray:2 2}
.gbox .writer{position:absolute;inset:0}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hero-char{order:-1}}

.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 32px}
@media (max-width:760px){.row3{grid-template-columns:1fr}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.stat{display:flex;align-items:center;gap:14px}
.stat .big{font-size:26px;font-weight:800;line-height:1.1}
.stat .sub{color:var(--ink-3);font-size:14px}
.ring{width:60px;height:60px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--jade);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.badge-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.badge-ic svg{width:28px;height:28px}
.bi-verm{background:var(--verm-soft);color:var(--verm)}
.bi-sun{background:var(--sun-soft);color:var(--t3)}
.bi-jade{background:var(--jade-soft);color:var(--jade)}
.bi-blue{background:var(--blue-soft);color:var(--t1)}
h2.sec{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lvl{position:relative;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;color:inherit;font-size:inherit}
.lvl .n{display:block;font-size:22px;font-weight:800}
.lvl .m{font-size:13px;color:var(--ink-3);line-height:1.5;margin-top:4px}
.lvl.on{border-color:var(--jade);box-shadow:0 4px 0 var(--jade-d);cursor:pointer;background:var(--jade-soft)}
.lvl.on .n{color:var(--jade-ink)}
.lvl.on .m{color:var(--jade-ink)}
.lvl{cursor:pointer}
.lvl:hover{border-color:var(--line-2)}
.lvl.off{cursor:default}
.lvl.off .n{color:var(--ink-3)}
.lvl .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.lvl.on .tag{background:var(--jade);color:#fff}
.tag svg{width:12px;height:12px}

/* ---------- Danh sách bài ---------- */
.lhead{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.lhead h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.lhead .zh-d{color:var(--verm)}
.lead{color:var(--ink-2);margin:0 0 20px;max-width:65ch}
.units{display:flex;flex-direction:column;gap:12px}
.unit{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:inherit;text-align:left;width:100%;font-size:inherit}
.unit.on{cursor:pointer;border-color:var(--jade);box-shadow:0 4px 0 var(--jade-d)}
.unit.off{cursor:default}
.unit .zhb{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-zh-d);font-size:21px;font-weight:700;background:var(--surface-2);color:var(--ink-3);flex:none}
.unit.on .zhb{background:var(--verm-soft);color:var(--verm)}
.unit .grow{flex:1;min-width:0}
.unit .ut{font-weight:700;font-size:17px}
.unit .us{color:var(--ink-3);font-size:14px}
.unit .end{color:var(--ink-3);flex:none}
.unit .end svg{width:22px;height:22px}
.pbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.pbar span{display:block;height:100%;background:var(--jade);border-radius:99px}

/* ---------- Bài học ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.py{font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tone{padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;color:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:inherit}
.tone:hover{border-color:var(--line-2)}
.contour{width:60px;height:46px;display:block;margin-bottom:6px}
.contour .lv{stroke:var(--line);stroke-width:1}
.contour .cv{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.contour .dt{fill:currentColor}
.tone .syl{font-size:28px;font-weight:800}
.tone .zh{font-size:22px;margin-left:6px;color:var(--ink)}
.tone .nm{font-size:13px;color:var(--ink-2);margin-top:4px;font-weight:600}
.tone .gl{font-size:13px;color:var(--ink-3)}
.note{margin-top:20px;padding:16px 18px;border-radius:16px;background:var(--sun-soft);color:var(--sun-ink)}
.note h3{margin:0 0 6px;font-size:16px}
.note p{margin:4px 0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcard{position:relative;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.vcard .h{font-family:var(--f-zh);font-size:34px;line-height:1.25;padding-right:44px}
.vcard .py{font-size:17px}
.vcard .m{margin-top:2px;font-weight:600}
.vcard .hv{font-size:13px;color:var(--ink-3)}
.vcard .nt{font-size:13px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
.vcard .spk{position:absolute;top:12px;right:12px}
.spk-b{color:var(--jade)}
.rad{font-family:var(--f-zh-d);font-size:44px;color:var(--verm);line-height:1.1}
.rex{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rex span{font-family:var(--f-zh);font-size:20px;padding:2px 10px;border-radius:10px;background:var(--surface-2)}
.gblock{padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);margin-bottom:14px}
.gblock h3{margin:0 0 6px;font-size:18px}
.gblock .desc{margin:0;color:var(--ink-2)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.fx{padding:6px 12px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:15px}
.fx.k{background:var(--verm-soft);color:var(--verm-ink);font-family:var(--f-zh);font-size:18px;padding:3px 12px}
.fl{font-size:13px;color:var(--ink-3);font-weight:600;min-width:74px}
.exs{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:12px}
.exs li{display:flex;gap:12px;align-items:flex-start}
.exs .zh{font-size:20px;display:block}
.exs .p{color:var(--ink-2);font-size:14px;display:block}
.exs .tr{color:var(--ink-3);font-size:14px;display:block}
.dtools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--jade);color:var(--jade-ink);background:var(--jade-soft)}
.pill svg{width:16px;height:16px}
.dlg{display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.line.b{align-self:flex-end;flex-direction:row-reverse}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-zh);font-weight:700;font-size:15px;flex:none}
.line.a .av{background:var(--sun-soft);color:var(--sun-ink)}
.line.b .av{background:var(--jade-soft);color:var(--jade-ink)}
.bubble{padding:10px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:left;color:inherit;font-size:inherit}
.line.b .bubble{background:var(--jade-soft);border-color:var(--jade-soft)}
.bubble.playing{border-color:var(--sun)}
.bubble .zh{font-size:22px;display:block;line-height:1.35}
.bubble .p{display:block;font-size:14px;color:var(--ink-2)}
.bubble .tr{display:block;font-size:14px;color:var(--ink-3)}
.hide-py .bubble .p{display:none}
.hide-tr .bubble .tr{display:none}
.wchars{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.wchar{position:relative;width:54px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-zh);font-size:26px;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.wchar[aria-pressed="true"]{border-color:var(--verm);color:var(--verm);box-shadow:0 3px 0 var(--verm-d)}
.wchar .dot{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center}
.wchar .dot svg{width:12px;height:12px}
.wstage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.gbox.lg{width:300px;height:300px}
.winfo .zh{font-size:15px}
.winfo .big-py{font-size:30px}
.winfo .m{font-size:18px;font-weight:600;margin:2px 0 12px}
.winfo .meta{color:var(--ink-3);font-size:14px;margin-bottom:16px}
.wbtns{display:flex;flex-wrap:wrap;gap:10px}
.wstatus{min-height:26px;font-weight:600;margin-top:14px;color:var(--ink-2)}
.wstatus.ok{color:var(--jade-ink)}
.wstatus.bad{color:var(--verm-ink)}
@media (max-width:640px){.wstage{grid-template-columns:1fr}.gbox.lg{width:min(300px,100%);height:auto;aspect-ratio:1;margin:0 auto}}
.cta-end{margin-top:28px;padding:18px 20px;border-radius:18px;background:var(--jade-soft);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cta-end p{margin:0;flex:1;min-width:200px;color:var(--jade-ink);font-weight:600}

/* ---------- Luyện tập ---------- */
.prac{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.prac-top{display:flex;align-items:center;gap:14px;padding:18px 0 8px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .35s ease}
.prac-count{font-weight:700;color:var(--ink-3);font-size:14px;min-width:40px;text-align:right}
.prac-body{flex:1;padding:12px 0 28px}
.kind{display:inline-block;font-size:13px;font-weight:700;color:var(--verm);margin-top:8px}
.prac-q{font-size:24px;margin:2px 0 20px;letter-spacing:-.01em;line-height:1.3}
.stim{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stim .zh{font-size:60px;line-height:1.1}
.stim .quote{font-size:20px;font-weight:600;padding:10px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.speaker{width:92px;height:92px;border-radius:26px;background:var(--jade);color:#fff;border:0;box-shadow:0 5px 0 var(--jade-d);cursor:pointer;display:grid;place-items:center}
.speaker:active{transform:translateY(5px);box-shadow:none}
.speaker svg{width:44px;height:44px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:17px;color:var(--ink);cursor:pointer;text-align:left}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-3);flex:none;font-family:var(--f-ui)}
.opt.zh-o{font-family:var(--f-zh);font-size:26px;font-weight:500}
.opt.py-o{font-size:22px}
.opt:hover:not(:disabled){border-color:var(--line-2)}

  async call(path, { method = 'GET', body } = {}) {

    Object.entries(doc.srs).forEach(([k, v]) => {
      const cur = S.srs[k];
      if (!cur || new Date(v.due || 0) > new Date(cur.due || 0)) S.srs[k] = v;

  S.api.dirty = true;

  if (!S.api.on || !S.user || S.api.syncing || !S.api.dirty) return;

    const { status, data } = await API.call('/progress', { method: 'PUT', body: { version: S.api.ver, doc: { p: S.p, srs: S.srs } } });

/* ---------- Pinyin: chấp nhận cả dấu thanh, số thanh và kiểu gõ Telex (ả = thanh 3) ---------- */
const MARKS = {};
[['a', 'āáǎà'], ['e', 'ēéěè'], ['i', 'īíǐì'], ['o', 'ōóǒò'], ['u', 'ūúǔù'], ['ü', 'ǖǘǚǜ']].forEach(([b, s]) => [...s].forEach((ch, i) => { MARKS[ch] = [b, i + 1]; }));
[['a', 'ả'], ['e', 'ẻ'], ['i', 'ỉ'], ['o', 'ỏ'], ['u', 'ủ']].forEach(([b, ch]) => { MARKS[ch] = [b, 3]; });
function parsePinyin(input) {
  const s = input.normalize('NFC').toLowerCase().replace(/v/g, 'ü');
  let letters = ''; const tones = [];
  for (const ch of s) {
    if (MARKS[ch]) { letters += MARKS[ch][0]; tones.push(MARKS[ch][1]); }
    else if (/[1-4]/.test(ch)) tones.push(+ch);
    else if (/[a-zü]/.test(ch)) letters += ch;
  }
  return { letters, tones };
}

let zhVoice = null, voicesLoaded = false, warnedVoice = false;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if (vs.length) voicesLoaded = true;
  zhVoice = vs.find(v => /^zh[-_](CN|Hans)/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function utter(text, pitch = 1) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.82; u.pitch = pitch;
  if (zhVoice) u.voice = zhVoice;
  return u;
}
function voiceCheck() {
  if (!('speechSynthesis' in window)) { toast(tr('Trình duyệt này chưa hỗ trợ đọc văn bản.', 'This browser cannot read text aloud.')); return false; }
  if (voicesLoaded && !zhVoice && !warnedVoice) {
    warnedVoice = true;
    toast(tr('Máy chưa có giọng đọc tiếng Trung nên âm có thể sai. Bản chính thức sẽ dùng audio chuẩn.', 'No Chinese voice on this device, so audio may be off. The full version uses recorded audio.'));
  }
  return true;
}
function speak(text) { if (!voiceCheck()) return; speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

  if (x <= 0) return;
  const k = dayKey();
  S.p.days[k] = (S.p.days[k] || 0) + x;
  S.p.xp += x;
  if (S.p.lastDay !== k) {
    const y = dayKey(new Date(Date.now() - 864e5));
    S.p.streak = S.p.lastDay === y ? S.p.streak + 1 : 1;
    S.p.lastDay = k;
  }
  saveP(); renderTopRight();
}

/* Hệ thống cấp độ – công thức phải khớp server/src/level.js, nếu lệch thì số hiển thị sẽ nhảy khi đồng bộ.
   Cấp 1→2 cần 100 XP, mỗi cấp sau cộng thêm 50 XP. */
const LV_BASE = 100, LV_STEP = 50;
const xpToReach = n => (n <= 1 ? 0 : ((n - 1) * (2 * LV_BASE + (n - 2) * LV_STEP)) / 2);
const rankOf = lv => lv >= 40 ? tr('Cao thủ', 'Master')
  : lv >= 25 ? tr('Thành thạo', 'Expert')
  : lv >= 15 ? tr('Nâng cao', 'Advanced')
  : lv >= 8 ? tr('Trung cấp', 'Intermediate')
  : lv >= 3 ? tr('Sơ cấp', 'Beginner')
  : tr('Nhập môn', 'Starter');
function userLevel(xp) {
  const x = Math.max(0, Math.floor(Number(xp) || 0));
  let lv = 1;
  while (xpToReach(lv + 1) <= x) lv += 1;
  const floor = xpToReach(lv), next = xpToReach(lv + 1);
  return { lv, level: lv, xp: x, into: x - floor, need: next - floor, toNext: next - x,
           percent: Math.round(((x - floor) / (next - floor)) * 100), rank: rankOf(lv) };
}

/* Bài học nổi bật: chọn theo ngày nên mỗi ngày một bộ khác nhau, nhưng trong ngày thì ổn định */
function featuredLessons(n) {
  const all = [];
  ['20', '30'].forEach(ver => booksOfVer(ver).forEach(lv => BOOKS[bookId(ver, lv)].lessons.forEach(L => all.push({ ver, lv, L }))));
  const seed = Math.floor(Date.now() / 864e5), out = [], used = new Set();
  for (let i = 0; out.length < n && i < all.length * 2; i++) {
    const j = (seed * 7 + i * 13) % all.length;
    if (used.has(j)) continue;
    used.add(j); out.push(all[j]);
  }
  return out;
}

/* Lịch nhiệt 90 ngày: mỗi ô là một ngày, đậm dần theo XP */
function heatCells() {
  const cells = [];
  const first = new Date(Date.now() - 89 * 864e5);
  for (let i = 0; i < (first.getDay() + 6) % 7; i++) cells.push(null);   /* chừa ô trống để cột bắt đầu từ thứ Hai */
  for (let i = 89; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5), k = dayKey(d);
    cells.push({ k, xp: S.p.days[k] || 0, today: i === 0, d });
  }
  return cells;
}
function bestStreak() {
  const ks = Object.keys(S.p.days).filter(k => S.p.days[k] > 0).sort();
  let best = 0, run = 0, prev = null;
  ks.forEach(k => {
    const d = new Date(k + 'T00:00:00');
    run = prev && (d - prev) === 864e5 ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  });
  return best;
}

function tryMatch() {

const PRAISE = [{ vi: 'Chính xác!', en: 'Correct!' }, { vi: 'Tuyệt vời!', en: 'Great job!' }, { vi: 'Chuẩn luôn!', en: 'Spot on!' }];

/* ---------- Thẻ ghi nhớ (lịch ôn đơn giản; giai đoạn 3 thay bằng FSRS) ---------- */
let C = null;
/* Bộ thẻ: 'lesson' = từ vựng bài 1; 'L1'...'L7' = cấp HSK theo phiên bản đang chọn.
   Mỗi lượt = thẻ đến hạn + tối đa NEW_PER_SESSION từ mới để không bị ngợp. */
const NEW_PER_SESSION = 15;
function deckWords(deck) {
  if (deck === 'lesson') return VOCAB.map(v => WMAP[v.h]).filter(Boolean);
  if (deck.startsWith('B')) {   /* B20-3 = giáo trình 2.0, bài 3; chỉ từ mới chính, không gồm từ mở rộng */
    const [pre, n] = deck.slice(1).split('-');
    const [ver, lv] = pre.includes('b') ? [pre.split('b')[0], +pre.split('b')[1]] : [pre, 1];
    const B = BOOKS[bookId(ver, lv)];
    const L = B && B.lessons.find(x => x.n === +n);
    return L ? coreWords(L) : [];
  }
  return levelWords(+deck.slice(1));
}
function startCards() {
  const ws = deckWords(S.deck), now = Date.now();
  const due = ws.filter(w => S.srs[w.s] && S.srs[w.s].due <= now).map(w => w.s);
  const fresh = ws.filter(w => !S.srs[w.s]).slice(0, S.deck === 'lesson' ? 50 : NEW_PER_SESSION).map(w => w.s);
  C = { queue: [...shuffle(due), ...fresh], flipped: false, reviewed: 0, total: ws.length, map: Object.fromEntries(ws.map(w => [w.s, w])) };
}

  const m = ms / 60e3;
  if (m < 60) return m <= 1 ? tr('<1 phút', '<1 min') : `${Math.round(m)} ${tr('phút', 'min')}`;
  return `${Math.round(ms / 864e5)} ${tr('ngày', 'd')}`;
}
function cardCtl() {

  return `<div class="rates">${b('again', 'r-again', tr('Quên', 'Again'))}${b('hard', 'r-hard', tr('Khó', 'Hard'))}${b('good', '', tr('Nhớ', 'Good'))}${b('easy', 'r-easy', tr('Dễ', 'Easy'))}</div>`;
}

function rateCard(g) {

/* =====================================================================
   Kho dữ liệu HSK 3.0 (sinh bởi content-pipeline/build_content.py)
   DB.w: [chữ, pinyin theo âm tiết, chuỗi thanh, cấp 2021, cấp 2025, EN, VI, Hán Việt]
   DB.h: [chữ, cấp 2021, pinyin, thanh, số nét, Hán Việt]
   DB.g: điểm ngữ pháp { code, l21, cat[], zh, vi?, note?, ex[{zh, py, vi?, k?}] }
   ===================================================================== */
const DB = __DB__;
const WORDS = DB.w.map((r, i) => ({ i, s: r[0], sy: r[1].split(' '), tn: [...r[2]].map(Number), l21: r[3], l25: r[4], en: r[5], vi: r[6], hv: r[7], l20: r[8] }));
const WMAP = {};
WORDS.forEach(w => { if (!WMAP[w.s]) WMAP[w.s] = w; });
/* Cụm từ riêng của bài học (ví dụ 你好) không nằm trong danh sách chuẩn: thêm vào bảng tra để bộ thẻ Bài 1 đủ từ */
VOCAB.forEach(v => {
  if (!WMAP[v.h]) WMAP[v.h] = { i: -1, s: v.h, sy: v.py.map(x => x[0].trim()), tn: v.py.map(x => x[1]), vi: v.vi, en: v.en, hv: v.hv, l21: 0, l25: 0, l20: 0 };
});
const HANZI = DB.h.map(r => ({ c: r[0], l21: r[1], py: r[2], tn: r[3], sc: r[4], hv: r[5] }));
const GRAM = DB.g;
/* Hai phiên bản đồng bộ với hai giáo trình: '20' = đề cương HSK 2.0 (6 cấp), '30' = đề cương HSK 3.0 áp dụng 2026 (cấp 7–9 gộp) */
const lvsFor = (ver = S.ver) => (ver === '20' ? [1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 7]);
const verName = (ver = S.ver) => (ver === '20' ? 'HSK 2.0' : 'HSK 3.0');
const lvName = n => (n === 7 ? '7–9' : String(n));
const wLevel = (w, ver = S.ver) => (ver === '20' ? w.l20 : w.l25);
const HMAP = Object.fromEntries(HANZI.map(h => [h.c, h]));
const pyPairs = w => w.sy.map((s, k) => [s, w.tn[k]]);
const shortEn = en => (en || '').split(';').slice(0, 2).join(';').trim();
const meaning = w => (S.lang === 'vi' && w.vi ? w.vi : shortEn(w.en));
/* bỏ dấu để tìm kiếm: "xin chao", "nihao", "pengyou" đều khớp */
const fold = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();

const levelCache = {};
function levelWords(n, ver = S.ver) {
  const k = ver + ':' + n;
  return levelCache[k] || (levelCache[k] = WORDS.filter(w => wLevel(w, ver) === n));
}
/* Chữ Hán theo cấp: HSK 3.0 dùng bảng chữ chuẩn 2021; HSK 2.0 không có bảng chữ riêng nên tách từ từ vựng từng cấp */
const hanziCache = {};
function levelHanzi(n, ver = S.ver) {
  if (ver !== '20') return HANZI.filter(h => h.l21 === n);
  if (hanziCache[n]) return hanziCache[n];
  const seen = new Set(), out = [];
  for (let k = 1; k < n; k++) levelWords(k, '20').forEach(w => [...w.s].forEach(c => seen.add(c)));
  levelWords(n, '20').forEach(w => [...w.s].forEach(c => {
    if (/[\u3400-\u9fff]/.test(c) && !seen.has(c)) { seen.add(c); out.push(HMAP[c] || { c, py: '', tn: 5, sc: 0, hv: '' }); }
  }));
  return (hanziCache[n] = out);
}
/* Ngữ pháp theo cấp: HSK 3.0 tham chiếu 572 điểm chuẩn 2021; HSK 2.0 cấp 1 lấy từ giáo trình, các cấp khác chờ giáo trình */
function levelGram(n, ver = S.ver) {
  if (ver !== '20') return GRAM.filter(g => g.l21 === n);
  const B = typeof BOOKS !== 'undefined' && BOOKS[`hsk20_${n}`];
  if (!B) return [];
  return B.lessons.flatMap(L => L.grammar.map((g, i) => ({ code: `B${L.n}.${i + 1}`, l21: 1, cat: [tr(`Bài ${L.n}: ${L.zh}`, `Lesson ${L.n}: ${L.zh}`)], zh: g.zh, vi: g.vi, note: g.note, ex: g.ex })));
}

let searchIdx = null; /* dựng lười ở lần tìm đầu tiên để trang mở nhanh */
function wordMatches(list, q) {
  if (!q || !q.trim()) return list;
  if (!searchIdx) searchIdx = WORDS.map(w => `${w.s}|${fold(w.sy.join(''))}|${fold(w.sy.join(' '))}|${fold(w.vi)}|${(w.en || '').toLowerCase()}|${fold(w.hv)}`);
  const a = fold(q.trim()), b = a.replace(/\s+/g, '');
  return list.filter(w => { const t = searchIdx[w.i]; return t.includes(a) || (b.length > 1 && t.includes(b)); });
}

const catName = cat => cat.map(c => (S.lang === 'vi' && CAT_VI[c]) || c).join(' / ');

const PAGE = 60;
function renderLibrary() {

    ['words', tr('Từ vựng', 'Vocabulary'), levelWords(n).length],

function renderLibResults() {
  const box = $('#libRes');
  if (!box) return;
  releaseWriters();
  const n = S.lib.lvl;
  if (S.lib.tab === 'words') box.innerHTML = libWords(n);
  else if (S.lib.tab === 'hanzi') { box.innerHTML = libHanzi(n); mountLibWriter(); }
  else box.innerHTML = libGrammar(n);
}
function libWords(n) {
  const all = wordMatches(levelWords(n), S.lib.q);
  if (!all.length) return `<p class="empty-note">${tr('Không có từ nào khớp. Thử gõ pinyin không dấu, ví dụ "pengyou", hoặc nghĩa tiếng Việt không dấu.', 'No matching words. Try pinyin without tones, e.g. "pengyou".')}</p>`;
  const pages = Math.ceil(all.length / PAGE);
  const pg = Math.min(Math.max(S.lib.page, 0), pages - 1);
  S.lib.page = pg;
  const other = S.ver === '20' ? 'l25' : 'l20';
  const otherName = S.ver === '20' ? 'HSK 3.0' : 'HSK 2.0';
  const rows = all.slice(pg * PAGE, (pg + 1) * PAGE);
  return `<p class="hint">${num(all.length)} ${tr('từ', 'words')}${pages > 1 ? `, ${tr('trang', 'page')} ${pg + 1}/${pages}` : ''}</p>
  <div class="wlist">${rows.map(w => `<div class="wrow">
    <button class="icon-btn spk-b" data-act="speak" data-arg="${w.s}" aria-label="${tr('Nghe', 'Listen to')} ${w.s}">${ic('volume')}</button>
    <span class="wz" lang="zh-CN">${w.s}</span>
    <span class="wp">${py(pyPairs(w))}</span>
    <span class="wm">${esc(meaning(w))}${S.lang === 'vi' && !w.vi ? `<span class="en-tag" title="${tr('Nghĩa tiếng Việt đang được biên soạn', '')}">EN</span>` : ''}${S.lang === 'vi' && w.hv ? `<small>${esc(w.hv)}</small>` : ''}</span>
    <span class="wlv">${w[other] ? `${otherName}: HSK ${lvName(w[other])}` : ''}</span>
  </div>`).join('')}</div>
  ${pages > 1 ? `<div class="pager">
    <button class="btn btn-ghost btn-sm" data-act="page" data-arg="-1" ${pg === 0 ? 'disabled' : ''}>${ic('back')}${tr('Trước', 'Prev')}</button>
    <span>${pg + 1} / ${pages}</span>
    <button class="btn btn-ghost btn-sm" data-act="page" data-arg="1" ${pg >= pages - 1 ? 'disabled' : ''}>${tr('Sau', 'Next')}${ic('chev')}</button>
  </div>` : ''}`;
}
function libHanzi(n) {
  const q = S.lib.q.trim(), fq = fold(q);
  const list = levelHanzi(n).filter(h => !q || q.includes(h.c) || fold(h.py).startsWith(fq) || fold(h.hv) === fq);
  if (!list.length) return `<p class="empty-note">${tr('Không có chữ nào khớp.', 'No matching characters.')}</p>`;
  if (!list.some(h => h.c === S.lib.char)) S.lib.char = list[0].c;
  const h = list.find(x => x.c === S.lib.char);
  const has = !!CHAR_DATA[h.c];
  const related = WORDS.filter(w => w.s.length > 1 && w.s.includes(h.c) && wLevel(w) && wLevel(w) <= n).slice(0, 8);
  return `<p class="hint">${S.ver === '20' ? tr('HSK 2.0 không có bảng chữ riêng: đây là các chữ xuất hiện lần đầu trong từ vựng của cấp này.', 'Characters appearing for the first time in this level’s vocabulary.') : tr('Danh sách chữ theo chuẩn 2021 (đề cương 2026 chưa tách chữ theo cấp).', 'Character list of the 2021 standard.')}</p>
  <div class="card hzpanel">
    <div class="gbox md">${gridSvg()}${has ? '<div class="writer" id="libW"></div>' : `<div class="hzstatic" lang="zh-CN">${h.c}</div>`}</div>
    <div class="winfo">
      <div class="big-py">${py([[h.py, h.tn]])}</div>
      ${S.lang === 'vi' && h.hv ? `<div class="m">${tr('Hán Việt', 'Sino-Vietnamese')}: ${esc(h.hv)}</div>` : ''}
      <div class="meta">${h.sc ? `${h.sc} ${tr('nét', 'strokes')}. ` : ''}${has ? tr('Phần tô đỏ là bộ thủ.', 'The red part is the radical.') : ''}</div>
      ${has ? `<div class="wbtns">
          <button class="btn btn-ghost btn-sm" data-act="wanim">${ic('play')}${tr('Xem cách viết', 'Show strokes')}</button>
          <button class="btn btn-sm" data-act="wquiz">${ic('pen')}${tr('Tự viết', 'Write it')}</button>
          <button class="icon-btn spk-b" data-act="speak" data-arg="${h.c}" aria-label="${tr('Nghe', 'Listen')}">${ic('volume')}</button>
        </div><div class="wstatus" id="wStatus" aria-live="polite"></div>`
      : `<p class="hint">${tr('Bản chính thức tải dữ liệu nét của mọi chữ theo nhu cầu. Bản demo chỉ nhúng sẵn các chữ HSK 1.', 'The full version loads stroke data on demand; this demo bundles HSK 1 characters only.')}</p>
         <button class="icon-btn spk-b" data-act="speak" data-arg="${h.c}" aria-label="${tr('Nghe', 'Listen')}">${ic('volume')}</button>`}
      ${related.length ? `<div class="hzwords">${related.map(w => `<button class="chipw" data-act="speak" data-arg="${w.s}"><span class="zh" lang="zh-CN">${w.s}</span><small>${esc(meaning(w))}</small></button>`).join('')}</div>` : ''}
    </div>
  </div>
  <div class="hzgrid">${list.map(x => `<button class="hz ${x.c === h.c ? 'on' : ''}" data-act="hz" data-arg="${x.c}" aria-pressed="${x.c === h.c}"><span class="zh" lang="zh-CN">${x.c}</span><small class="t${x.tn}">${esc(x.py)}</small></button>`).join('')}</div>`;
}
function libGrammar(n) {
  const raw = S.lib.q.trim(), q = fold(raw);
  const list = levelGram(n).filter(g => !q || fold(g.zh).includes(q) || fold(g.vi).includes(q) || fold(g.note).includes(q) || g.code.includes(raw) || g.ex.some(e => e.zh.includes(raw)));
  if (!levelGram(n).length) return `<p class="empty-note">${tr(`Ngữ pháp HSK 2.0 cấp ${n} sẽ được bổ sung khi có giáo trình tương ứng.`, 'Grammar for this level will be added with its textbook.')}</p>`;
  if (!list.length) return `<p class="empty-note">${tr('Không có điểm ngữ pháp nào khớp.', 'No matching grammar points.')}</p>`;
  const noVi = S.lang === 'vi' && !list.some(g => g.vi);
  const refNote = S.ver === '30' ? `<p class="hint">${tr('Đây là ngữ pháp tham chiếu theo cấp. Ngữ pháp theo từng bài của giáo trình 新HSK教程 nằm trong mục Bài học.', 'Reference grammar by level; per-lesson grammar is in Lessons.')}</p>` : '';
  let last = '';
  return `${refNote}${noVi ? `<div class="note" style="margin:0 0 12px"><p>${tr('Giải thích tiếng Việt cho cấp này đang được biên soạn. Hiện đã có tên điểm ngữ pháp gốc, pinyin và toàn bộ câu ví dụ theo chuẩn.', '')}</p></div>` : ''}
  <div>${list.map(g => {
    const cat = g.cat.join('/');
    const head = cat !== last ? `<h3 class="gcat">${esc(catName(g.cat))}</h3>` : '';
    last = cat;
    const title = S.lang === 'vi' && g.vi ? `<b>${esc(g.vi)}</b><span class="zh">${esc(g.zh)}</span>` : `<b class="zh">${esc(g.zh)}</b>`;
    return head + `<details class="gp"><summary><span class="gcode" title="${esc(g.code)}">#${esc(g.code.replace(/^\D+/, ''))}</span><span class="gt">${title}</span>${ic('chev', 'gchev')}</summary>

/* ---------- Phiên luyện tập sinh tự động theo cấp ---------- */
const VOWELS = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
const bareSyl = x => [...x.normalize('NFC')].map(c => (MARKS[c] ? MARKS[c][0] : c)).join('');
/* Đặt dấu thanh theo quy tắc: a/e trước, rồi o trong "ou", còn lại là nguyên âm cuối */
function retone(syl, t) {
  const b = bareSyl(syl).toLowerCase();
  if (t === 5) return b;
  let k = b.search(/[ae]/);
  if (k < 0) k = b.indexOf('ou');
  if (k < 0) k = Math.max(b.lastIndexOf('i'), b.lastIndexOf('o'), b.lastIndexOf('u'), b.lastIndexOf('ü'));
  return k < 0 ? b : b.slice(0, k) + VOWELS[b[k]][t - 1] + b.slice(k + 1);
}
function buildLevelSession(n, ver) {
  const all = levelWords(n, ver).filter(w => w.s.length <= 4);
  return buildWordSession(all, all);
}
/* targets: từ được hỏi; distract: kho từ để lấy phương án nhiễu (bài hiện tại + các bài trước) */
function buildWordSession(targetsIn, distract) {
  /* Một phiên chỉ dùng MỘT ngôn ngữ nghĩa: nếu trộn Việt/Anh thì phương án tiếng Việt duy nhất sẽ lộ đáp án.
     Dùng tiếng Việt khi kho từ đã có >= 60% nghĩa tiếng Việt. */
  const useVi = S.lang === 'vi' && distract.filter(w => w.vi).length >= distract.length * 0.6;
  const meaning = w => (useVi ? w.vi : shortEn(w.en));
  const pool = shuffle(distract.filter(w => meaning(w) && w.s.length <= 4 && !/…/.test(w.s)));
  const targets = shuffle(targetsIn.filter(w => meaning(w) && w.s.length <= 4 && !/…/.test(w.s)));
  if (pool.length < 8 || !targets.length) return buildSession();
  const used = new Set();
  /* ưu tiên từ chưa hỏi; bài ít từ thì cho phép hỏi lại */
  const take = pred => {
    let w = targets.find(x => !used.has(x.s) && pred(x));
    if (!w) w = shuffle(targets).find(pred);
    if (w) used.add(w.s);
    return w;
  };
  const others = (w, key) => {
    const seen = new Set([key(w)]), out = [];
    for (const x of shuffle(pool)) { if (out.length === 3) break; if (!seen.has(key(x))) { seen.add(key(x)); out.push(x); } }
    return out;
  };
  const opts = (w, key) => shuffle([w, ...others(w, key)]).map(x => ({ o: key(x), ok: x === w }));
  const expl = w => `${w.s} ${w.sy.join('')}: ${meaning(w)}${S.lang === 'vi' && w.hv ? ` (Hán Việt: ${w.hv})` : ''}`;
  const P_ = {
    mcq: { vi: 'Từ này nghĩa là gì?', en: 'What does this word mean?' },
    rev: { vi: 'Chọn từ có nghĩa này', en: 'Pick the word with this meaning' },
    listen: { vi: 'Nghe và chọn từ bạn nghe được', en: 'Listen and pick what you hear' },
    tone: { vi: 'Chọn pinyin đúng của chữ này', en: 'Pick the correct pinyin' },
    type: { vi: 'Gõ pinyin có thanh điệu', en: 'Type the pinyin with tones' },
    match: { vi: 'Ghép từ với nghĩa', en: 'Match each word to its meaning' }
  };
  const make = {
    mcq() { const w = take(() => true); return w && { type: 'mcq', prompt: P_.mcq, hanzi: w.s, options: opts(w, meaning), explain: expl(w) }; },
    rev() { const w = take(() => true); return w && { type: 'mcq', prompt: P_.rev, quote: meaning(w), options: opts(w, x => x.s), optZh: true, ansZh: true, explain: expl(w) }; },
    listen() { const w = take(() => true); return w && { type: 'listen', prompt: P_.listen, audio: w.s, options: opts(w, x => x.s), optZh: true, ansZh: true, explain: expl(w) }; },
    tone() {
      const w = take(x => x.s.length === 1 && x.tn[0] >= 1 && x.tn[0] <= 4);
      return w && { type: 'tone', prompt: P_.tone, hanzi: w.s, optPy: true, explain: expl(w),
        options: shuffle([1, 2, 3, 4].map(t => ({ o: retone(w.sy[0], t), ok: t === w.tn[0] }))) };
    },
    type() {
      const w = take(x => x.sy.length <= 3 && x.tn.every(t => t >= 1 && t <= 4) && /^[a-zü]+$/.test(bareSyl(x.sy.join('')).toLowerCase()));
      return w && { type: 'type', prompt: P_.type, hanzi: w.s, letters: bareSyl(w.sy.join('')).toLowerCase(), tones: w.tn.slice(), display: w.bp || w.sy.join(''), explain: expl(w) };
    },
    match() {
      const ws = [];
      for (let k = 0; k < 5; k++) {
        const w = take(x => x.s.length <= 3 && meaning(x).length <= 30 && !ws.some(y => y.s === x.s || meaning(y) === meaning(x)));
        if (w) ws.push(w);
      }
      return ws.length >= 4 && { type: 'match', prompt: P_.match, pairs: ws.map(w => [w.s, meaning(w)]),
        explain: { vi: 'Ghép đủ các cặp mà không sai lần nào mới được tính điểm.', en: 'Match every pair without a mistake to score.' } };
    }
  };
  return ['mcq', 'tone', 'listen', 'rev', 'match', 'type', 'mcq', 'listen', 'type', 'rev'].map(k => make[k]()).filter(Boolean);
}

async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return 'x' + h.toString(16);
}

/** Danh sách bài đã hoàn thành / đang học, lấy từ khoá tiến độ dạng "20b2-5". */
function lessonProgress() {
  const done = [], doing = [];
  ['20', '30'].forEach(ver => booksOfVer(ver).forEach(lv => {
    const B = BOOKS[bookId(ver, lv)];
    B.lessons.forEach(L => {
      const key = bPre(ver, lv) + '-' + L.n;
      const item = { ver, lv, L, key, pct: bookPct(L.n, ver, lv) };
      if ((S.p.bdone || {})[key]) done.push(item);
      else if ((S.p.bseen || {})[key]) doing.push(item);
    });
  }));
  return { done, doing };
}

/** Hiển thị lỗi theo từng ô mà máy chủ trả về (422 kèm fields). */
function showApiErrors(e) {
  const f = (e.data && e.data.fields) || {};
  const map = { name: 'aName', username: 'aUser', email: 'aMail', password: 'aPass', next: 'aPass' };
  let first = null;
  Object.entries(f).forEach(([k, m]) => { const id = map[k] || k; setErr(id, m); first = first || id; });
  if (!Object.keys(f).length) toast(e.message || tr('Không kết nối được máy chủ.', 'Cannot reach the server.'));
  if (first && $('#' + first)) $('#' + first).focus();
}
async function apiLogin(id, p) {
  if (!id) { setErr('aUser', tr('Nhập tên đăng nhập hoặc email.', 'Enter your username or email.')); return; }
  if (!p) { setErr('aPass', tr('Nhập mật khẩu.', 'Enter your password.')); return; }
  try {
    const { data } = await API.call('/auth/login', { method: 'POST', body: { id, password: p } });
    signIn({ name: data.user.name, username: data.user.username, method: 'password' });
    await pullProgress();
  } catch (e) {
    if (e.status === 401) setErr('aPass', tr('Thông tin đăng nhập không đúng.', 'Those details do not match an account.'));
    else if (e.status === 429) toast(e.message);
    else showApiErrors(e);
  }
}
async function apiRegister() {
  const body = { name: val('aName').trim(), username: val('aUser').trim().toLowerCase(), email: val('aMail').trim() || null, password: val('aPass') };
  if (val('aPass2') !== body.password) { setErr('aPass2', tr('Hai mật khẩu chưa khớp nhau.', 'Passwords do not match.')); return; }
  try {
    const { data } = await API.call('/auth/register', { method: 'POST', body });
    signIn({ name: data.user.name, username: data.user.username, method: 'password' });
    queueSync(0);                      // đẩy tiến độ đã học lúc chưa đăng nhập lên tài khoản mới
  } catch (e) {
    if (e.status === 409) setErr('aUser', tr('Tên đăng nhập hoặc email đã được dùng.', 'Username or email already in use.'));
    else showApiErrors(e);
  }
}

/**
 * Thu nhỏ ảnh ngay trên trình duyệt trước khi gửi: cạnh dài tối đa 256 px, xuất WebP (PNG nếu trình duyệt cũ).
 * Làm ở client để không phải cài thư viện xử lý ảnh trên server và để tiết kiệm băng thông của người dùng.
 */
function shrinkImage(file, max = 256) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new Error(tr('Chỉ nhận ảnh PNG, JPEG hoặc WebP.', 'PNG, JPEG or WebP only.')));
    if (file.size > 8 * 1024 * 1024) return reject(new Error(tr('Tệp quá lớn (giới hạn 8 MB).', 'File too large (8 MB limit).')));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, 0, 0, w, h);
      let out = cv.toDataURL('image/webp', 0.85);
      if (!out.startsWith('data:image/webp')) out = cv.toDataURL('image/png');   // Safari cũ không xuất được WebP
      if (out.length > 260000) out = cv.toDataURL('image/jpeg', 0.7);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(tr('Không đọc được tệp ảnh.', 'Could not read the image.'))); };
    img.src = url;
  });
}

/** Lưu hồ sơ: có backend thì gọi API, không thì lưu trong trình duyệt để bản demo vẫn dùng được. */
async function saveProfile(patch) {
  S.prof.busy = true;
  try {
    if (S.api.on) {
      const { data } = await API.call('/account/profile', { method: 'POST', body: patch });
      S.user = { ...S.user, name: data.user.name, avatarUrl: data.user.avatarUrl };
      S.prof.data.user = { ...S.prof.data.user, ...data.user };
    } else {
      S.user = { ...S.user, ...(patch.name ? { name: patch.name } : {}), ...(patch.avatar !== undefined ? { avatarUrl: patch.avatar } : {}) };
      S.prof.data.user = { ...S.prof.data.user, ...S.user };
    }
    store.set('user', S.user);
    S.prof.editing = false;
    toast(tr('Đã lưu hồ sơ.', 'Profile saved.'));
  } catch (e) {
    const f = (e.data && e.data.fields) || {};
    if (f.name) setErr('pName', f.name);
    if (f.avatar) setErr('pAvatar', f.avatar);
    if (!f.name && !f.avatar) toast(e.message || tr('Không lưu được hồ sơ.', 'Could not save the profile.'));
  } finally {
    S.prof.busy = false;
    render({ keepScroll: true });
    renderTopRight();
  }
}

  },

  oauth(a) {
    /* Có backend và Google đã cấu hình thì chuyển hướng thật; bản tĩnh chỉ giải thích phần còn thiếu */

    toast(tr('Đăng nhập Google cần backend đang chạy và OAuth Client ID đã cấu hình.', 'Google sign-in needs the backend running with an OAuth client configured.'));
  },
  async login() {
    const id = val('aUser').trim().toLowerCase(), p = val('aPass');
    if (S.api.on) return apiLogin(id, p);
    let bad = false;
    if (!id) { setErr('aUser', tr('Nhập tên đăng nhập hoặc email.', 'Enter your username or email.')); bad = true; }
    if (!p) { setErr('aPass', tr('Nhập mật khẩu.', 'Enter your password.')); bad = true; }
    if (bad) return;
    const users = store.get('users', {});
    /* cho phép đăng nhập bằng email đã đăng ký, không chỉ tên đăng nhập */
    const u = users[id] ? id : Object.keys(users).find(k => (users[k].email || '').toLowerCase() === id);
    const rec = u && users[u];
    if (!rec || rec.hash !== await hashPw(p, rec.salt)) { setErr('aPass', tr('Thông tin đăng nhập không đúng.', 'Those details do not match an account.')); return; }
    signIn({ name: rec.name, username: u, method: 'password' });
  },
  async register() {
    if (S.api.on) return apiRegister();
    const name = val('aName').trim(), u = val('aUser').trim().toLowerCase(), mail = val('aMail').trim(), p = val('aPass'), p2 = val('aPass2');
    const users = store.get('users', {});
    const errs = {};
    if (!name) errs.aName = tr('Nhập tên hiển thị.', 'Enter a display name.');
    if (!/^[a-z0-9._]{3,24}$/.test(u)) errs.aUser = tr('Tên đăng nhập gồm 3–24 ký tự: chữ thường, số, dấu chấm hoặc gạch dưới.', 'Use 3–24 lowercase letters, digits, dots or underscores.');
    else if (users[u]) errs.aUser = tr('Tên đăng nhập này đã có người dùng.', 'That username is taken.');
    if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) errs.aMail = tr('Email chưa đúng định dạng.', 'That email does not look valid.');
    else if (mail && Object.values(users).some(r => (r.email || '').toLowerCase() === mail.toLowerCase())) errs.aMail = tr('Email này đã được dùng.', 'That email is already in use.');
    if (p.length < 8) errs.aPass = tr('Mật khẩu cần tối thiểu 8 ký tự.', 'Password needs at least 8 characters.');
    if (p2 !== p) errs.aPass2 = tr('Hai mật khẩu chưa khớp nhau.', 'Passwords do not match.');
    Object.entries(errs).forEach(([k, m]) => setErr(k, m));
    if (Object.keys(errs).length) { $('#' + Object.keys(errs)[0]).focus(); return; }
    const salt = Math.random().toString(36).slice(2);
    users[u] = { name, salt, hash: await hashPw(p, salt), created: Date.now(), email: mail };
    store.set('users', users);
    signIn({ name, username: u, method: 'password' });
  },
  forgot() {
    toast(tr('Chưa có mail server nên quản trị viên sẽ tạo link đặt lại mật khẩu dùng một lần trong trang quản trị và gửi cho bạn.', 'Without a mail server, an admin creates a one-time reset link for you.'));
  },
  async logout() {

    S.user = null; S.authTab = 'login'; S.api.ver = 0; store.del('user');
    toast(tr('Đã đăng xuất.', 'Signed out.'));
    render();
  }
};

/* =====================================================================
   Lộ trình giáo trình (sinh bởi content-pipeline/build_books.py)
   BOOKS.hsk20_1: Giáo trình chuẩn HSK 1 (HSK标准教程, đề cương 2.0)
   BOOKS.hsk30_1: 新HSK教程 1 (đề cương 3.0)
   Mỗi bài: words (k: core | again), extra (vượt cấp, không bắt buộc), proper, grammar,
            pinyin/hanzi (chỉ 2.0), chars (chữ để tập viết)
   ===================================================================== */
const BOOKS = __BOOKS__;
/* Mỗi phiên bản có nhiều quyển: hsk20_1, hsk20_2, hsk30_1, hsk30_2… */
const bookId = (ver, lv) => `hsk${ver}_${lv}`;
const booksOfVer = (ver = S.ver) => [1, 2, 3, 4, 5, 6].filter(l => BOOKS[bookId(ver, l)]);
const bookOf = (ver = S.ver, lv = S.bookLv) => BOOKS[bookId(ver, lv)] || BOOKS[bookId(ver, 1)];
/* Khoá tiến độ/thẻ: quyển 1 giữ dạng cũ "20-5" để người dùng không mất tiến độ đã có; quyển sau là "20b2-5" */
const bPre = (ver, lv) => (lv === 1 ? ver : `${ver}b${lv}`);
/* từ riêng của sách (你好, 这个, tên riêng…) cần có trong bảng tra để thẻ nhớ hiển thị được */
Object.values(BOOKS).forEach(b => b.lessons.forEach(L => [...L.words, ...L.extra, ...L.proper].forEach(w => { if (!WMAP[w.s]) WMAP[w.s] = w; })));
const bKey = (n, ver = S.ver, lv = S.bookLv) => `${bPre(ver, lv)}-${n}`;
const bookTabs = (ver = S.ver) => [
  ['words', tr('Từ mới', 'Vocabulary')],
  ['dialogue', tr('Hội thoại', 'Dialogue')],
  ['grammar', tr('Ngữ pháp', 'Grammar')],
  ...(ver === '20' ? [['sounds', tr('Phát âm và chữ Hán', 'Sounds and characters')]] : []),
  ['writing', tr('Tập viết', 'Writing')]
];
function bookPct(n, ver = S.ver) {
  const seen = ((S.p.bseen || {})[bKey(n, ver)]) || {};
  return Math.round(Object.keys(seen).length / bookTabs(ver).length * 60 + (((S.p.bdone || {})[bKey(n, ver)]) ? 40 : 0));
}

  <button class="seg" data-act="ver" data-arg="20" aria-pressed="${S.ver === '20'}">HSK 2.0</button>

/* pinyin theo cách ghi của sách, giữ khoảng trắng và dấu cách âm, tô màu theo từng âm tiết */
function bookPy(w) {
  const bp = w.bp || '';
  if (!w.sy || bp.includes('/') || bp.includes('…')) return `<span class="py">${esc(bp || (w.sy || []).join(''))}</span>`;
  let i = 0;
  const parts = w.sy.map((s, k) => {
    i += s.length;
    let sp = '';
    while (i < bp.length && /[\s'’]/.test(bp[i])) { sp += bp[i]; i++; }
    return [s + sp, w.tn[k]];
  });
  return py(parts);
}

/* Luyện tập theo bài: hỏi đúng từ mới của bài, phương án nhiễu lấy từ bài này và các bài trước */
function buildBookSession(ver, lv, n) {
  const B = bookOf(ver, lv);
  const L = B.lessons.find(x => x.n === n);
  const earlier = booksOfVer(ver).filter(l => l < lv).flatMap(l => BOOKS[bookId(ver, l)].lessons.flatMap(coreWords));
  const pool = earlier.concat(B.lessons.filter(x => x.n <= Math.max(n, 3)).flatMap(coreWords));
  const auto = buildWordSession(coreWords(L), pool).slice(0, 6);
  const own = S.lang === 'vi' ? shuffle(authoredItems(L)) : [];
  /* xen kẽ: câu tự biên soạn và câu tự sinh từ từ vựng */
  const out = [];
  while (own.length || auto.length) { if (auto.length) out.push(auto.shift()); if (own.length) out.push(own.shift()); }
  return out;
}
const BOOK_ACT = {
  bopen(a) { S.bl = +a; S.btab = 'words'; go('book'); },
  btab(a) { S.btab = a; render({ keepScroll: true }); },
  bchar(a) { S.bchar = a; render({ keepScroll: true }); },
  bline(a) { const [si, li] = a.split('-').map(Number); const L = curBookLesson(); if (L && L.dlg) speak(L.dlg[si].lines[li].zh); },
  bplay(a) {
    const L = curBookLesson(); if (!L || !L.dlg || !voiceCheck()) return;
    const sc = L.dlg[+a], box = $('#scene' + a);
    const bubbles = box ? $$('.bubble', box) : [];
    const order = []; sc.lines.forEach(l => { if (!order.includes(l.sp)) order.push(l.sp); });
    speechSynthesis.cancel();
    sc.lines.forEach((l, i) => {
      const u = utter(l.zh, order.indexOf(l.sp) % 2 === 0 ? 1.2 : 0.85);
      u.onstart = () => bubbles.forEach((b, j) => b.classList.toggle('playing', i === j));
      if (i === sc.lines.length - 1) u.onend = () => bubbles.forEach(b => b.classList.remove('playing'));
      speechSynthesis.speak(u);
    });
  },
  bprac(a) { S.pracSrc = { book: S.ver, lv: S.bookLv, n: +a }; go('practice'); },
  bcards(a) { S.deck = `B${bPre(S.ver, S.bookLv)}-${a}`; store.set('deck', S.deck); go('cards'); },
  booklv(a) { S.bookLv = +a; store.set('bookLv', S.bookLv); S.bl = 1; store.set('bl', 1); render({ keepScroll: true }); },
  navtoggle(a) {
    const open = !S.navOpen[a];
    S.navOpen = open ? { [a]: true } : {};   /* chỉ mở một nhóm để menu không dài quá màn hình */
    store.set('navOpen', S.navOpen); renderNav();
  },
  golibtab(a) { S.lib.tab = a; S.lib.q = ''; S.lib.page = 0; S.lib.char = null; go('library'); },
  /* mở đúng bài của gợi ý hôm nay: "30-2-7" = HSK 3.0, quyển 2, bài 7 */
  goles(a) {
    const [ver, lv, n] = a.split('-');
    S.ver = ver; store.set('ver', ver);
    S.bookLv = +lv; store.set('bookLv', S.bookLv);
    S.bl = +n; store.set('bl', S.bl);
    S.btab = 'words';
    go('book');
  },
  /* từ lộ trình trang chủ: mở đúng phiên bản + quyển, hoặc thư viện nếu cấp đó chưa có giáo trình */
  gobook(a) {
    const [ver, lv] = a.split('-');
    S.ver = ver; store.set('ver', ver);
    S.bookLv = +lv; store.set('bookLv', S.bookLv);
    S.bl = 1; store.set('bl', 1);
    go('lessons');
  },
  golib(a) {
    const [ver, lv] = a.split('-');
    S.ver = ver; store.set('ver', ver);
    Object.assign(S.lib, { lvl: +lv, tab: 'words', q: '', page: 0, char: null });
    store.set('lib', { lvl: +lv, tab: 'words' });
    go('library');
  }
};

const VIEWS = { home: renderHome, library: renderLibrary, lessons: renderBookList, book: renderBook, profile: renderProfile, lesson: renderLesson, practice: renderPractice, cards: renderCards, stats: renderStats, login: renderLogin, about: renderAbout };
function render(opts = {}) {

/* Mỗi lần đổi trang là một mục trong lịch sử trình duyệt, nên nút Back của trình duyệt,
   cử chỉ vuốt trên điện thoại và nút Quay lại trong app đều đưa về đúng trang trước.
   URL dùng dạng #route để chia sẻ được link sâu mà vẫn là một file tĩnh. */
S.hist = [];
function go(r, { replace = false } = {}) {
  stopSpeech();
  if (r === 'practice') P = null;
  if (r === 'cards') C = null;
  if (r !== S.route) {
    if (replace) history.replaceState({ r }, '', '#' + r);
    else { S.hist.push(S.route); if (S.hist.length > 30) S.hist.shift(); history.pushState({ r }, '', '#' + r); }
  }
  S.route = r;
  render();
}
/* Trình duyệt Back/Forward: chỉ đổi trang, không đẩy thêm mục lịch sử */
window.addEventListener('popstate', e => {
  const r = (e.state && e.state.r) || location.hash.slice(1) || 'home';
  if (!VIEWS[r]) return;
  stopSpeech();
  if (r === 'practice') P = null;
  if (r === 'cards') C = null;
  S.hist.pop();
  S.route = r;
  render();
});
/** Quay lại: có lịch sử trong app thì lùi một bước, không thì về trang chủ. */
function goBack() {
  if (S.hist.length) history.back();
  else go('home', { replace: true });
}
const backBtn = () => `<button class="icon-btn" data-act="back" aria-label="${tr('Quay lại', 'Back')}">${ic('back')}</button>`;

/* ---------- Event delegation ---------- */
const ACT = {
  nav(a) { if (a === 'practice') S.pracSrc = { lvl: S.lib.lvl, ver: S.ver }; go(a); },
  again() { go('practice'); },
  lessonprac() { S.pracSrc = 'lesson'; go('practice'); },
  ...LIB_ACT,
  ...BOOK_ACT,
  ...AUTH_ACT,
  lang() { S.lang = S.lang === 'vi' ? 'en' : 'vi'; store.set('lang', S.lang); document.documentElement.lang = S.lang; render({ keepScroll: true }); },
  theme() {
    const next = isDark() ? 'light' : 'dark';
    S.theme = next; store.set('theme', next);
    document.documentElement.dataset.theme = next;
    render({ keepScroll: true }); /* vẽ lại Hanzi Writer với màu mới */
  },
  speak(a) { speak(a); },
  tab(a) { S.tab = a; stopSpeech(); render({ keepScroll: true }); },
  speakline(a) { speak(DIALOGUE.lines[+a].h); },
  playall() {
    if (!voiceCheck()) return;
    speechSynthesis.cancel();
    const bubbles = $$('#dlg .bubble');
    DIALOGUE.lines.forEach((l, i) => {
      const u = utter(l.h, l.s === 'A' ? 1.2 : 0.85);
      u.onstart = () => bubbles.forEach((b, j) => b.classList.toggle('playing', i === j));
      if (i === DIALOGUE.lines.length - 1) u.onend = () => bubbles.forEach(b => b.classList.remove('playing'));
      speechSynthesis.speak(u);
    });
  },
  togglepy(_, b) { S.showPy = !S.showPy; b.setAttribute('aria-pressed', S.showPy); $('#dlg').classList.toggle('hide-py', !S.showPy); },
  toggletr(_, b) { S.showTr = !S.showTr; b.setAttribute('aria-pressed', S.showTr); $('#dlg').classList.toggle('hide-tr', !S.showTr); },
  wchar(a) { S.wchar = a; render({ keepScroll: true }); },
  wanim() {
    if (!S.writer) return;
    try { S.writer.cancelQuiz(); } catch (e) {}
    S.writer.showOutline();
    S.writer.animateCharacter({ onComplete: () => wStatus(tr('Giờ thử tự viết nhé.', 'Now try writing it yourself.')) });
    wStatus(tr('Quan sát thứ tự nét…', 'Watch the stroke order…'));
  },
  wquiz() {
    if (!S.writer) return;
    const c = S.writerChar, total = CHAR_DATA[c].strokes.length;
    S.writer.hideCharacter();
    wStatus(tr(`Viết nét 1/${total}`, `Stroke 1/${total}`));
    S.writer.quiz({
      onCorrectStroke: d => wStatus(d.strokesRemaining ? tr(`Tốt! Viết nét ${d.strokeNum + 2}/${total}`, `Good! Stroke ${d.strokeNum + 2}/${total}`) : '', 'ok'),
      onMistake: d => wStatus(d.mistakesOnStroke >= 2 ? tr('Nhìn gợi ý rồi viết lại nét này.', 'Follow the hint and try again.') : tr('Chưa đúng nét, thử lại.', 'Not that stroke, try again.'), 'bad'),
      onComplete: d => {
        wStatus(d.totalMistakes ? tr(`Hoàn thành, sai ${d.totalMistakes} lần.`, `Done with ${d.totalMistakes} mistake(s).`) : tr('Hoàn hảo, không sai nét nào!', 'Perfect, no mistakes!'), 'ok');
        if (!S.p.charsDone[c]) { S.p.charsDone[c] = 1; saveP(); addXP(5); toast('+5 XP'); const btn = $(`.wchar[data-arg="${c}"]`); if (btn && !btn.querySelector('.dot')) btn.insertAdjacentHTML('beforeend', `<span class="dot">${ic('check')}</span>`); }
      }
    });
  },
  opt(a) { selectOpt(+a); },
  tileadd(a) { if (P.checked || P.order.includes(+a)) return; P.order.push(+a); speak(P.tiles[+a]); $('#orderBox').innerHTML = orderHtml(); setCheckEnabled(true); },
  tilerm(a) { if (P.checked) return; P.order.splice(+a, 1); $('#orderBox').innerHTML = orderHtml(); setCheckEnabled(P.order.length > 0); },
  ml(a) { if (P.checked || P.lock) return; P.m.sl = +a; tryMatch(); },
  mr(a) { if (P.checked || P.lock) return; P.m.sr = +a; tryMatch(); },
  check() { if (P.checked) nextStep(); else check(); },
  flip() {
    if (!C || !C.queue.length) return;
    C.flipped = !C.flipped;
    $('.fc').classList.toggle('flip', C.flipped);
    $('#fcCtl').innerHTML = cardCtl();
    if (C.flipped) speak(C.queue[0]);
  },
  rate(a) { rateCard(a); },
  cardsall() { deckWords(S.deck).forEach(w => { if (S.srs[w.s]) S.srs[w.s].due = 0; }); store.set('srs', S.srs); C = null; renderCards(); },
  deck(a) { if (!a) return; S.deck = a; store.set('deck', a); C = null; renderCards(); },
  reset(_, b) {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = tr('Bấm lần nữa để xóa hẳn', 'Click again to confirm'); b.classList.add('btn-verm'); return; }
    S.p = JSON.parse(JSON.stringify(DEFAULT_P)); S.srs = {};
    store.del('progress'); store.del('srs');
    toast(tr('Đã xóa dữ liệu học thử.', 'Demo progress cleared.'));
    render();
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.tagName === 'A') e.preventDefault();
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset.arg, b, e);
});
let libT = null;
document.addEventListener('change', e => { if (e.target.id === 'deckSel') ACT.deck(e.target.value); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pyInput') { const er = $('#pyErr'); if (er) er.textContent = ''; }
  if (t.id === 'libQ') { clearTimeout(libT); libT = setTimeout(() => { S.lib.q = t.value; S.lib.page = 0; renderLibResults(); }, 160); }
  const f = t.closest && t.closest('.fld'); if (f) { const er = f.querySelector('.err'); if (er) er.textContent = ''; }
});
document.addEventListener('keydown', e => {
  /* Enter trong form đăng nhập/đăng ký = bấm nút chính (không dùng thẻ <form>) */
  if (S.route === 'login' && e.key === 'Enter' && e.target.matches && e.target.matches('.auth input')) {
    e.preventDefault(); const b = $('#authSubmit'); if (b) b.click(); return;
  }
  /* thẻ div có role=button cần kích hoạt được bằng bàn phím */
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (S.route !== 'practice' || !P || P.finished) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'button') return; /* Enter trên nút đã tự click */
  if (e.key === 'Enter') { const btn = $('#checkBtn'); if (btn && !btn.disabled) { e.preventDefault(); btn.click(); } return; }
  if (tag === 'input') return;
  const it = cur();
  if (it.options && !P.checked && /^[1-9]$/.test(e.key) && +e.key <= it.options.length) selectOpt(+e.key - 1);
});
/* Theo dõi đổi theme hệ thống khi người dùng chưa chọn */
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if (!S.theme && S.route !== 'practice') render({ keepScroll: true }); };
  mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
}

/* ---------- Khởi động ---------- */
if (S.theme) document.documentElement.dataset.theme = S.theme;
document.documentElement.lang = S.lang;
/* Kết quả quay về từ Google/Zalo: /?login=ok hoặc /?login=error&reason=... */
(function handleOAuthReturn() {
  const p = new URLSearchParams(location.search);
  if (!p.has('login')) return;
  const ok = p.get('login') === 'ok';
  setTimeout(() => toast(ok
    ? tr('Đăng nhập thành công.', 'Signed in.')
    : tr(`Đăng nhập không thành công (${p.get('reason') || 'lỗi không rõ'}).`, `Sign-in failed (${p.get('reason') || 'unknown'}).`)), 400);
  history.replaceState(null, '', location.pathname);
})();

if (!window.HanziWriter) console.error('Hanzi Writer chưa nạp được');
(function openFromHash() {
  const r = location.hash.slice(1);
  if (r && VIEWS[r] && r !== 'practice') S.route = r;   /* practice cần chọn nguồn trước nên không mở thẳng */
  history.replaceState({ r: S.route }, '', S.route === 'home' ? location.pathname : '#' + S.route);
})();
render();
detectApi();   /* dò backend sau khi vẽ xong: trang tĩnh vẫn dùng được ngay, không phải chờ mạng */
})();
</script>
</body>
